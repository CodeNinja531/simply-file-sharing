<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Access Directory</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; color: #333; line-height: 1.5; }
    h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
    .nav-form { display: flex; gap: 8px; margin-bottom: 20px; }
    .nav-form input { flex: 1; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 4px; }
    .nav-form button { padding: 10px 16px; font-size: 15px; background: #0066cc; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    .nav-form button:hover { background: #0052a3; }
    .breadcrumbs { font-size: 14px; margin-bottom: 15px; background: #f5f5f5; padding: 8px 12px; border-radius: 4px; }
    .breadcrumbs a { color: #0066cc; text-decoration: none; }
    .file-list { list-style: none; padding: 0; border: 1px solid #eee; border-radius: 4px; }
    .file-list li { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid #eee; }
    .file-list li:last-child { border-bottom: none; }
    .file-list a { text-decoration: none; color: #0066cc; }
    .file-list a:hover { text-decoration: underline; }
    .download-btn { font-size: 12px; background: #28a745; color: white; padding: 4px 8px; border-radius: 3px; text-decoration: none !important; }
    .folder-link { font-weight: bold; }
    .error { color: #d9534f; background: #fdf7f7; border: 1px solid #d9534f; padding: 10px; border-radius: 4px; }
  </style>
</head>
<body>

  <h1>File Downloads</h1>

  <form id="pathForm" class="nav-form">
    <input type="text" id="dirInput" placeholder="Enter subfolder path (e.g. docs/reports)" />
    <button type="submit">Navigate</button>
  </form>

  <div id="breadcrumbs" class="breadcrumbs">Location: <code>/</code></div>
  <ul id="fileList" class="file-list"><li>Loading...</li></ul>

  <script>
    // Handles URL route parsing and navigation
    function getPathFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get('path') || '';
    }

    function setPathToURL(path) {
      const cleanPath = path.replace(/^\/+|\/+$/g, '');
      const newUrl = cleanPath ? `?path=${encodeURIComponent(cleanPath)}` : window.location.pathname;
      window.history.pushState({}, '', newUrl);
      loadDirectory(cleanPath);
    }

    async function loadDirectory(path) {
      const container = document.getElementById('fileList');
      const breadcrumbs = document.getElementById('breadcrumbs');
      
      // Update display text
      breadcrumbs.innerHTML = `Location: <code>/${path}</code>`;
      container.innerHTML = '<li>Loading directory contents...</li>';

      // Path targeting files.json
      const manifestPath = path ? `./${path}/files.json` : './files.json';

      try {
        const response = await fetch(manifestPath);
        if (!response.ok) throw new Error('Directory manifest not found.');
        
        const files = await response.json();
        container.innerHTML = '';

        // Parent Directory Navigation Button
        if (path) {
          const parentPath = path.split('/').slice(0, -1).join('/');
          const parentLi = document.createElement('li');
          parentLi.innerHTML = `📁 <a class="folder-link" href="#" onclick="setPathToURL('${parentPath}'); return false;">.. (Parent Directory)</a>`;
          container.appendChild(parentLi);
        }

        if (files.length === 0) {
          container.innerHTML += '<li><em>This directory is empty.</em></li>';
          return;
        }

        // Render Folder and File items
        files.forEach(item => {
          const li = document.createElement('li');
          const itemFullPath = path ? `${path}/${item.name}` : item.name;

          if (item.type === 'directory') {
            li.innerHTML = `
              <span>📁 <a class="folder-link" href="#" onclick="setPathToURL('${itemFullPath}'); return false;">${item.name}/</a></span>
            `;
          } else {
            li.innerHTML = `
              <span>📄 <a href="./${itemFullPath}" target="_blank">${item.name}</a></span>
              <a href="./${itemFullPath}" download class="download-btn">Download</a>
            `;
          }
          container.appendChild(li);
        });

      } catch (err) {
        container.innerHTML = `<li class="error">Unable to list directory contents. Make sure <code>files.json</code> exists in this path.</li>`;
      }
    }

    // Event listener for path form entry
    document.getElementById('pathForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const inputVal = document.getElementById('dirInput').value.trim();
      setPathToURL(inputVal);
      document.getElementById('dirInput').value = '';
    });

    // Listen to browser Back/Forward actions
    window.addEventListener('popstate', () => loadDirectory(getPathFromURL()));

    // Initial Load
    loadDirectory(getPathFromURL());
  </script>
</body>
</html>
