<form id="directoryAccessForm" style="display: flex; flex-direction: column; gap: 10px; max-width: 400px;">
  <label for="dirPath">Enter Directory Path:</label>
  <input 
    type="text" 
    id="dirPath" 
    placeholder="e.g., reports/2026" 
    required 
    style="padding: 8px 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px;"
  />
  <button type="submit" style="padding: 10px; font-size: 16px; cursor: pointer;">
    Open Directory
  </button>
</form>

<script>
  document.getElementById('directoryAccessForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const dir = document.getElementById('dirPath').value.trim().replace(/^\/+|\/+$/g, '');
    if (dir) {
      // Redirects to /directory-name/ with a trailing slash to trigger auto-index
      window.location.href = '/' + encodeURIComponent(dir).replace(/%2F/g, '/') + '/';
    }
  });
</script>
