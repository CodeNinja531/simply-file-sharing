<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>File Access</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    .container {
      background: #ffffff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .input-box {
      width: 320px;
      padding: 10px 14px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
      box-sizing: border-box;
    }
    .input-box:focus {
      border-color: #0066cc;
    }
    .submit-btn {
      padding: 10px 18px;
      font-size: 1rem;
      color: #fff;
      background-color: #0066cc;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 8px;
    }
    .submit-btn:hover {
      background-color: #0052a3;
    }
  </style>
</head>
<body>

  <div class="container">
    <form id="fileForm">
      <input 
        type="text" 
        id="filePathInput" 
        class="input-box" 
        placeholder="Enter file name or path..." 
        required 
      />
      <button type="submit" class="submit-btn">Go</button>
    </form>
  </div>

  <script>
    document.getElementById('fileForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const pathValue = document.getElementById('filePathInput').value.trim();
      
      if (pathValue) {
        // Strip leading slash if entered manually to prevent double slashes (//string)
        const cleanPath = pathValue.replace(/^\/+/, '');
        
        // Redirect to /pathValue
        window.location.href = '/' + encodeURIComponent(cleanPath);
      }
    });
  </script>

</body>
</html>
